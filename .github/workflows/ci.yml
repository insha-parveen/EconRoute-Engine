name: CI

on:
  push:
    branches: [main, week-*]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: econroute
          POSTGRES_PASSWORD: econroute
          POSTGRES_DB: econroute
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U econroute"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install --no-cache-dir torch --index-url https://download.pytorch.org/whl/cpu
          pip install --no-cache-dir -r requirements-dev.txt -r requirements.txt

      - name: Lint with ruff (autofix then verify)
        run: |
          pip install ruff
          ruff check gateway/ tracking/ providers/ tests/ evals/ websocket/ --fix
          ruff check gateway/ tracking/ providers/ tests/ evals/ websocket/

      - name: Test with pytest
        env:
          DATABASE_URL: postgresql+asyncpg://econroute:econroute@localhost:5432/econroute
          REDIS_URL: redis://localhost:6379
          GROQ_API_KEY: gsk_test_key_for_ci
        run: |
          pip install pytest pytest-asyncio httpx pytest-timeout
          pytest tests/ -v --timeout=30

      # Gates on classifier accuracy >= 0.80 (run_eval.py exits 1 below target).
      # Runs fully offline — local MiniLM encoder, no Groq key, no Redis, no network.
      # This step exists because the eval silently rotted once: classify() gained a
      # tuple return and both eval scripts kept treating it as a str, so the quoted
      # accuracy became unreproducible for weeks. CI now catches that immediately.
      - name: Classifier accuracy eval (held-out, gates at 80%)
        run: python -m evals.run_eval

      - name: Upload eval artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: classifier-eval-results
          path: evals/results/run_eval.json
          if-no-files-found: warn

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20.14.10 (pinned)
        uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - uses: actions/checkout@v4

      - name: Build production Docker image
        run: docker build -f Dockerfile.prod -t econroute/gateway:latest .
